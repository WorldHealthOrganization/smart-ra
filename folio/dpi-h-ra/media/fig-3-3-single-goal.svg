<g class="av-legend"><rect x="24" y="879" width="829" height="414" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="34" y="897">Key</text><text class="av-keyh" x="34" y="913">Colour: which part of the architecture a box belongs to</text><rect x="34" y="922" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="92" y="933">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="34" y="942" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="92" y="953">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="34" y="962" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="92" y="973">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="34" y="982" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="92" y="993">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="34" y="1013">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="40,1021 72,1021 78,1027 78,1039 72,1045 40,1045 34,1039 34,1027" fill="#fff" stroke="#555"/><text class="av-key" x="92" y="1037">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="34" y="1051" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="92" y="1067">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="34" y="1081" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="92" y="1097">Rounded ends: a service, offered for others to use</text><rect x="34" y="1111" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="92" y="1127">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="34" y="1153">Other marks</text><rect x="34" y="1160" width="44" height="18" fill="#fff" stroke="#555"/><rect x="44" y="1165" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="92" y="1173">A box inside another box: a part of it</text><rect x="34" y="1182" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="34" y="1182" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="92" y="1193">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="34" y="1213">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M44 1229 L76 1229" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="92" y="1233">Realization: makes real, or achieves</text><path d="M44 1249 L76 1249" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="92" y="1253">Serving: serves (provides what the end needs)</text><path d="M44 1269 L76 1269" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="92" y="1273">Access: reads or writes data (the arrow shows which way the data goes)</text></g></svg>
