name: Build & Deploy RA Mapper

on:
  push:
    paths:
      - "archimate/**"
      - "tools/ra-mapper/**"
      - ".github/workflows/ra-mapper.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build mapper
        run: |
          cd tools/ra-mapper

          # The current version (from archimate/current.txt) is listed first, so it
          # becomes the mapper's default; the remaining version folders follow.
          CURRENT=""
          if [ -f ../../archimate/current.txt ]; then
            CURRENT=$(head -n1 ../../archimate/current.txt | tr -d '[:space:]')
            CURRENT="${CURRENT%/}"
          fi

          MODELS=(); LABELS=()
          add() {
            local m
            m=$(find "$1" -maxdepth 1 -name '*.archimate' -type f | head -1)
            if [ -n "$m" ]; then MODELS+=("$m"); LABELS+=("$2"); fi
          }

          [ -n "$CURRENT" ] && add "../../archimate/$CURRENT" "WHO RA ($CURRENT, current)"
          for DIR in ../../archimate/*/; do
            NAME=$(basename "$DIR")
            [ "$NAME" = "$CURRENT" ] && continue
            add "$DIR" "WHO RA ($NAME)"
          done

          echo "Building mapper with: ${LABELS[*]}"
          python3 build_ra_mapper.py "${MODELS[@]}" -l "${LABELS[@]}" -o SMART-RA-Mapper.html

      - name: Prepare deploy layout
        run: |
          mkdir -p deploy_output/mapper
          cp tools/ra-mapper/SMART-RA-Mapper.html deploy_output/mapper/index.html
          cp tools/ra-mapper/SMART-RA-Mapper.html deploy_output/mapper/SMART-RA-Mapper.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          keep_files: true
