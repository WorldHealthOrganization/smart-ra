# Standing re-pin: keeps every upstream layer this site follows on the newest
# green commit of its main, writing the standing consent declared on each
# layer's `trust.standing` in index.config.json (owner, 2026-11-12,
# Q-BIBNAV-2 "B": platform fixes reach the site without a hand re-pin).
# It opens or updates ONE `repin/standing-*` PR with auto-merge.
# The reusable workflow is litlfred/cat-harness-tools standing-repin.yml.
name: Standing repin

# No schedule (owner, 2026-11-16 card "Turn it off"): smart-ra development
# moved to WorldHealthOrganization/smart-ra, and every scheduled run here
# failed because Actions may not open PRs in this repository and no
# REPIN_TOKEN is set. It still runs on an upstream dispatch or by hand.
on:
  repository_dispatch:
    types: [upstream-merged]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would move"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  repin:
    uses: litlfred/cat-harness-tools/.github/workflows/standing-repin.yml@db55d2da5d4cc5947a5c03c9638d18ac3a8546f6 # index.lock.json
    with:
      dry-run: ${{ inputs.dry_run == true }}
    secrets:
      repin-token: ${{ secrets.REPIN_TOKEN }}
