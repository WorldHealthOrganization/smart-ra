name: Publish HTML Report

on:
  push:
    paths:
      - "archimate/**"
      - ".github/workflows/archimate.yml"
  workflow_dispatch: # manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for archimate folder
        id: check
        run: |
          if [ ! -d "archimate" ]; then
            echo "No archimate/ folder found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Each subfolder containing a .archimate file counts as a project
            FOLDERS=()
            for DIR in archimate/*/; do
              if ls "$DIR"*.archimate 1>/dev/null 2>&1; then
                FOLDERS+=("$DIR")
              fi
            done
            COUNT=${#FOLDERS[@]}
            echo "Found $COUNT project folder(s) with .archimate files"
            if [ "$COUNT" -eq 0 ]; then
              echo "No subfolders with .archimate files in archimate/ — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download and extract Archi
        if: steps.check.outputs.skip != 'true'
        run: |
          ARCHI_VERSION="5.9.0"
          ARCHI_URL="https://github.com/archimatetool/archi.io/releases/download/5.9.0/Archi-Linux64-5.9.0.tgz"
          echo "Downloading Archi ${ARCHI_VERSION}..."
          curl -fSL -o archi.tgz "${ARCHI_URL}"
          tar xzf archi.tgz
          rm archi.tgz

          # Find the actual Archi executable
          ARCHI_BIN=$(find . -maxdepth 3 -name "Archi" -type f -executable 2>/dev/null | head -1)
          if [ -z "$ARCHI_BIN" ]; then
            ARCHI_BIN=$(find . -maxdepth 3 -name "Archi" -type f | head -1)
            chmod +x "$ARCHI_BIN"
          fi
          echo "Found Archi binary at: $ARCHI_BIN"
          echo "ARCHI_BIN=$ARCHI_BIN" >> "$GITHUB_ENV"

      - name: Start virtual display
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Generate reports and lay out under /archimate
        if: steps.check.outputs.skip != 'true'
        run: |
          # Which version is "current" is declared in archimate/current.txt — a one-line
          # file containing the version folder name (e.g. "v2"). The current version's
          # report is ALSO published at the /archimate root, so the .archimate file
          # never has to be duplicated: it lives only in its own version folder.
          CURRENT_VERSION=""
          if [ -f archimate/current.txt ]; then
            CURRENT_VERSION=$(head -n1 archimate/current.txt | tr -d '[:space:]')
            CURRENT_VERSION="${CURRENT_VERSION%/}"
          fi
          echo "Current version: ${CURRENT_VERSION:-<none declared in archimate/current.txt>}"

          DEPLOY_DIR="deploy_output"
          ARCHIMATE_ROOT="$DEPLOY_DIR/$BASE_DIR/archimate"
          mkdir -p "$ARCHIMATE_ROOT"

          # Each subfolder of archimate/ is its own version and gets its own permalink:
          #   archimate/v1/ -> /archimate/v1
          #   archimate/v2/ -> /archimate/v2
          # and whichever one CURRENT points at is also mirrored to /archimate.
          for DIR in archimate/*/; do
            [ -d "$DIR" ] || continue
            MODEL=$(find "$DIR" -maxdepth 1 -name "*.archimate" -type f | head -1)
            [ -z "$MODEL" ] && continue

            FOLDER_NAME=$(basename "$DIR")
            echo "=== $FOLDER_NAME ($MODEL) ==="

            TMPDIR=$(mktemp -d)
            "$ARCHI_BIN" \
              -consoleLog -nosplash \
              -application com.archimatetool.commandline.app \
              --loadModel "$(pwd)/$MODEL" \
              --html.createReport "$TMPDIR"

            # Version permalink: /archimate/<name>
            DEST="$ARCHIMATE_ROOT/$FOLDER_NAME"
            mkdir -p "$DEST"
            cp -r "$TMPDIR"/* "$DEST"/ 2>/dev/null || true
            echo "  -> $DEST"

            # The current version is mirrored at the /archimate root (generated once, copied twice)
            if [ -n "$CURRENT_VERSION" ] && [ "$FOLDER_NAME" = "$CURRENT_VERSION" ]; then
              cp -r "$TMPDIR"/* "$ARCHIMATE_ROOT"/ 2>/dev/null || true
              echo "  -> $ARCHIMATE_ROOT (current)"
            fi

            rm -rf "$TMPDIR"
          done

          if [ -n "$CURRENT_VERSION" ] && [ ! -d "archimate/$CURRENT_VERSION" ]; then
            echo "::warning::archimate/current.txt points at '$CURRENT_VERSION' but archimate/$CURRENT_VERSION/ does not exist — nothing mirrored to /archimate root."
          fi

          echo "Final deploy structure:"
          find "$DEPLOY_DIR" -type f | head -80

      - name: Deploy to gh-pages
        if: steps.check.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          keep_files: true
