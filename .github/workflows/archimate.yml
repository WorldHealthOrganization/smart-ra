name: Publish HTML Report

on:
  push:
    paths:
      - "archimate/**"
      - ".github/workflows/publish-html-report.yml"
  workflow_dispatch: # manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for archimate folder
        id: check
        run: |
          if [ ! -d "archimate" ]; then
            echo "No archimate/ folder found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Each subfolder containing a .archimate file counts as a project
            FOLDERS=()
            for DIR in archimate/*/; do
              if ls "$DIR"*.archimate 1>/dev/null 2>&1; then
                FOLDERS+=("$DIR")
              fi
            done
            COUNT=${#FOLDERS[@]}
            echo "Found $COUNT project folder(s) with .archimate files"
            if [ "$COUNT" -eq 0 ]; then
              echo "No subfolders with .archimate files in archimate/ — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download and extract Archi
        if: steps.check.outputs.skip != 'true'
        run: |
          ARCHI_VERSION="5.8.0"
          ARCHI_URL="https://github.com/archimatetool/archi.io/releases/download/${ARCHI_VERSION}/Archi-Linux64-${ARCHI_VERSION}.tgz"
          echo "Downloading Archi ${ARCHI_VERSION}..."
          curl -fSL -o archi.tgz "${ARCHI_URL}"
          tar xzf archi.tgz
          rm archi.tgz

          # Find the actual Archi executable
          ARCHI_BIN=$(find . -maxdepth 3 -name "Archi" -type f -executable 2>/dev/null | head -1)
          if [ -z "$ARCHI_BIN" ]; then
            ARCHI_BIN=$(find . -maxdepth 3 -name "Archi" -type f | head -1)
            chmod +x "$ARCHI_BIN"
          fi
          echo "Found Archi binary at: $ARCHI_BIN"
          echo "ARCHI_BIN=$ARCHI_BIN" >> "$GITHUB_ENV"

      - name: Start virtual display
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Determine deploy layout and generate reports
        if: steps.check.outputs.skip != 'true'
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            BASE_DIR="."
          else
            BASE_DIR="branches/$BRANCH"
          fi

          COUNT=${{ steps.check.outputs.count }}
          DEPLOY_DIR="deploy_output"
          mkdir -p "$DEPLOY_DIR"

          # --- Root-level .archimate file (always goes to report/) ---
          ROOT_MODEL=$(find archimate -maxdepth 1 -name "*.archimate" -type f | head -1)
          if [ -n "$ROOT_MODEL" ]; then
            echo "=== Generating report for root model: $ROOT_MODEL ==="
            TMPDIR=$(mktemp -d)

            "$ARCHI_BIN" \
              -consoleLog -nosplash \
              -application com.archimatetool.commandline.app \
              --loadModel "$(pwd)/$ROOT_MODEL" \
              --html.createReport "$TMPDIR"

            DEST="$DEPLOY_DIR/$BASE_DIR/report"
            mkdir -p "$DEST"
            cp -r "$TMPDIR"/* "$DEST"/ 2>/dev/null || true
            rm -rf "$TMPDIR"
            echo "  Deployed to: $DEST"
          fi

          # --- Subfolder projects (each goes to report/{folder-name}/) ---
          for DIR in archimate/*/; do
            [ -d "$DIR" ] || continue
            MODEL=$(find "$DIR" -maxdepth 1 -name "*.archimate" -type f | head -1)
            [ -z "$MODEL" ] && continue

            FOLDER_NAME=$(basename "$DIR")
            echo "=== Generating report for $FOLDER_NAME ==="

            TMPDIR=$(mktemp -d)

            "$ARCHI_BIN" \
              -consoleLog -nosplash \
              -application com.archimatetool.commandline.app \
              --loadModel "$(pwd)/$MODEL" \
              --html.createReport "$TMPDIR"

            DEST="$DEPLOY_DIR/$BASE_DIR/report/$FOLDER_NAME"
            mkdir -p "$DEST"
            cp -r "$TMPDIR"/* "$DEST"/ 2>/dev/null || true
            rm -rf "$TMPDIR"

            echo "  Deployed to: $DEST"
          done

          echo "Final deploy structure:"
          find "$DEPLOY_DIR" -type f | head -50

      - name: Deploy to gh-pages
        if: steps.check.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          keep_files: true
