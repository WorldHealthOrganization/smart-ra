<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART RA Mapper — ABB / SBB Conformance</title>
<style>
:root{
  --blue:#0b5394; --blue-d:#083a68; --accent:#0093d5; --bg:#f4f7fa; --card:#ffffff;
  --ink:#1c2733; --muted:#5c6b7a; --line:#dde5ec;
  --st-unreviewed:#8e9aa6; --st-covered:#0b5394; --st-instantiated:#1a7f37; --st-partial:#b7791f; --st-gap:#c0392b; --st-na:#6b7280;
  --abb:#5b3fa8; --sbb:#0d7a72;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(90deg,var(--blue-d),var(--blue));color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8}
header .spacer{flex:1}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.primary{background:#fff;color:var(--blue);border-color:#fff;font-weight:600}
.btn.primary:hover{background:#e8f1fa}
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.18);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;color:#dbe7f3;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.active{background:#fff;color:var(--blue-d);font-weight:600}
main{flex:1;display:flex;min-height:0}
/* sidebar */
#sidebar{width:270px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sidebar .search{padding:10px}
#sidebar input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
#tree{flex:1;overflow:auto;padding:0 6px 12px}
.tnode{margin:2px 0}
.tnode>.hdr{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--blue-d)}
.tnode>.hdr:hover{background:#eef4f9}
.tnode .kids{margin-left:10px;display:none}
.tnode.open>.kids{display:block}
.tnode .caret{transition:transform .15s;font-size:10px;color:var(--muted)}
.tnode.open>.hdr .caret{transform:rotate(90deg)}
.tleaf{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.tleaf:hover{background:#eef4f9}
.tleaf.sel{background:var(--blue);color:#fff}
.tleaf .cnt{font-size:11px;color:var(--muted);background:#eef2f6;border-radius:10px;padding:1px 7px}
.tleaf.sel .cnt{background:rgba(255,255,255,.25);color:#fff}
.sideFoot{border-top:1px solid var(--line);padding:8px 12px;font-size:11px;color:var(--muted)}
/* list */
#listPane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.listBar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.listBar .title{font-weight:600;font-size:14px}
.listBar select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.listBar .n{color:var(--muted);font-size:12px}
#list{flex:1;overflow:auto;padding:10px 14px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:center}
.row:hover{border-color:var(--accent);box-shadow:0 1px 4px rgba(11,83,148,.12)}
.row.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(11,83,148,.18)}
.row .nm{font-weight:600;font-size:13.5px}
.row .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:0}
.badge{font-size:10.5px;padding:2px 8px;border-radius:10px;background:#e8eef5;color:var(--blue-d);white-space:nowrap}
.badge.folder{background:#f0ebfa;color:#5b3fa8}
.badge.abb{background:#efe9fb;color:var(--abb);font-weight:600}
.badge.sbb{background:#e2f4f2;color:var(--sbb);font-weight:600}
.chip{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:10px;color:#fff;white-space:nowrap}
.mapinfo{font-size:11.5px;color:var(--muted)}
/* detail */
#detail{width:450px;background:var(--card);border-left:1px solid var(--line);overflow:auto;display:none;flex-direction:column}
#detail.open{display:flex}
#detail .dhead{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
#detail .dhead .nm{font-size:15px;font-weight:700;color:var(--blue-d)}
#detail .close{float:right;border:0;background:#eef2f6;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px}
#detail .body{padding:14px 16px}
.sec{margin-bottom:18px}
.sec h3, h3.mini{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
.doc{font-size:13px;line-height:1.55;color:#2b3a49;white-space:pre-wrap;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:200px;overflow:auto}
.relgrp{margin-bottom:8px}
.relgrp .rt{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.rel{font-size:12.5px;padding:3px 0;color:var(--blue);cursor:pointer;display:flex;gap:6px;align-items:center}
.rel:hover{text-decoration:underline}
.rel .chipmini{width:8px;height:8px;border-radius:50%;flex:none}
/* mapping widgets */
.statusRow{display:flex;gap:6px;flex-wrap:wrap}
.stBtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600}
.stBtn.sel{border-color:currentColor;background:currentColor}
.stBtn.sel span{color:#fff}
.derivedNote{font-size:11.5px;color:var(--muted);margin-top:6px}
.mapItem{display:flex;align-items:center;gap:8px;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px}
.mapItem.abb{border-left:3px solid var(--abb)}
.mapItem.sbb{border-left:3px solid var(--sbb)}
.mapItem .li-nm{font-weight:600;font-size:12.5px}
.mapItem .li-ty{font-size:10.5px;color:var(--muted)}
.mapItem .rm{margin-left:auto;border:0;background:transparent;color:#c0392b;cursor:pointer;font-size:15px}
.via{font-size:10px;color:var(--muted);background:#eef2f6;border-radius:8px;padding:1px 6px;margin-left:4px}
.addGrid{display:grid;grid-template-columns:1fr 140px auto;gap:6px;margin-top:6px}
.addGrid3{display:grid;grid-template-columns:1.2fr .8fr .5fr auto;gap:6px;margin-top:6px}
.addGrid input,.addGrid select,.addGrid3 input,textarea.notes{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;width:100%}
.addGrid button,.addGrid3 button{border:0;background:var(--blue);color:#fff;border-radius:7px;padding:0 12px;cursor:pointer;font-size:16px}
textarea.notes{min-height:56px;resize:vertical;font-family:inherit}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
datalist{display:none}
/* dashboard & arch */
.page{flex:1;overflow:auto;padding:20px 26px;display:none}
.page.open{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpi .v{font-size:26px;font-weight:700;color:var(--blue-d)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.panel h2{font-size:14px;color:var(--blue-d);margin-bottom:12px}
.barRow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.barRow .lbl{width:210px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barRow .bar{flex:1;height:16px;background:#eef2f6;border-radius:8px;overflow:hidden;display:flex}
.barRow .seg{height:100%}
.barRow .pct{width:110px;flex:none;text-align:right;color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr.click:hover td{background:#f5f9fc;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#eef2f6;border-radius:9px;padding:2px 8px;margin:1px 3px 1px 0}
.tag .x{cursor:pointer;color:#c0392b;font-weight:700}
.tag.ref{background:#e8eef5;color:var(--blue-d)}
.tag.abb{background:#efe9fb;color:var(--abb)}
.iconbtn{border:0;background:transparent;cursor:pointer;color:#c0392b;font-size:14px}
.metaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.metaGrid label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.metaGrid input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:.95}
.savepill{font-size:11px;color:#cfe3f5}
.newBB{display:grid;grid-template-columns:1.2fr .9fr .6fr .5fr auto;gap:6px;margin-top:10px}
.newBB input,.newBB select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;width:100%}
.newBB button{border:0;background:var(--blue);color:#fff;border-radius:7px;padding:0 14px;cursor:pointer}
/* explore tree */
#explore{padding:0;flex-direction:column;min-height:0}
#explore.open{display:flex}
.xbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.xbar select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.xprog{font-size:12px;color:var(--muted)}
#xtree{flex:1;overflow:auto;padding:16px 20px}
.xn{margin:4px 0}
.xcard{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;max-width:960px;flex-wrap:wrap}
.xcard:hover{border-color:var(--accent)}
.xcard .xdot{width:10px;height:10px;border-radius:50%;flex:none}
.xcard .xname{font-weight:600;font-size:13px;cursor:pointer}
.xcard .xname:hover{color:var(--blue);text-decoration:underline}
.xcard .xmaps{font-size:11px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xexp{border:1px solid var(--line);background:#f2f6fa;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11.5px;color:var(--blue-d)}
.xexp:hover{background:#e2ecf5}
.xnm{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;color:var(--muted);padding:2px 4px;max-width:170px}
.xkids{margin-left:26px;border-left:2px solid var(--line);padding-left:14px;margin-top:4px}
.xglabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:8px 0 2px}
.xseen{font-size:11px;color:var(--muted);font-style:italic}
.xstat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.xbarmini{position:relative;width:64px;height:8px;background:#e6ebf1;border-radius:4px;overflow:hidden;display:inline-block}
.xbarmini i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.xbarmini i.r{background:#b7791f55}
.xbarmini i.c{background:var(--st-instantiated)}
/* mapping chain */
.chainBox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f7fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11.5px}
.chainNode{border-radius:6px;padding:3px 8px;font-weight:600}
.chainNode.sbb{background:#e2f4f2;color:var(--sbb)}
.chainNode.abb{background:#efe9fb;color:var(--abb)}
.chainNode.ref{background:#e8eef5;color:var(--blue-d)}
.chainArrow{color:var(--muted)}
/* import modal */
#modal .ovl{position:fixed;inset:0;background:rgba(8,28,48,.45);z-index:50;display:flex;align-items:center;justify-content:center}
#modal .box{background:#fff;border-radius:12px;width:780px;max-width:92vw;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#modal .mb{flex:1;overflow:auto;padding:8px 18px;min-height:120px}
#modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
#modal .mrow{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid #eef2f6;font-size:12.5px}
#modal .mrow b{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal input[type=search],#modal select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.btn2{border:0;background:var(--blue);color:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:12.5px}
.btn2.ghost{background:#eef2f6;color:var(--ink)}
.btn2.sbbc{background:var(--sbb)}
.btn2.abbc{background:var(--abb)}
@media (max-width:1100px){#detail{position:fixed;right:0;top:0;bottom:0;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:10}}
</style>
</head>
<body>
<header>
  <div>
    <h1>SMART RA Mapper</h1>
    <div class="sub" id="modelSub"></div>
  </div>
  <div class="tabs">
    <button id="tabBrowse" class="active" onclick="showTab('browse')">Reference ABBs</button>
    <button id="tabExplore" onclick="showTab('explore')">Perspectives</button>
    <button id="tabArch" onclick="showTab('arch')">My Architecture (ABB / SBB)</button>
    <button id="tabDash" onclick="showTab('dash')">Conformance Dashboard</button>
  </div>
  <div class="spacer"></div>
  <span class="savepill" id="savePill"></span>
  <select id="refVersion" title="Reference architecture version" style="padding:6px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:13px;max-width:240px"></select>
  <button class="btn" onclick="refFile.click()" title="Load another RA version from file (.archimate or exchange XML)">Load RA file…</button>
  <button class="btn" onclick="importFile.click()">Import mapping…</button>
  <button class="btn primary" onclick="exportXML()">Export mapping (ArchiMate XML)</button>
  <input type="file" id="importFile" accept=".xml,.archimate" style="display:none">
  <input type="file" id="archImportFile" accept=".xml,.archimate" style="display:none">
  <input type="file" id="refFile" accept=".xml,.archimate" style="display:none">
</header>
<main>
  <div id="sidebar">
    <div class="search"><input type="search" id="q" placeholder="Search reference ABBs…"></div>
    <div id="tree"></div>
    <div class="sideFoot" id="sideFoot"></div>
  </div>
  <div id="listPane">
    <div class="listBar">
      <span class="title" id="listTitle">All elements</span>
      <span class="n" id="listCount"></span>
      <span style="flex:1"></span>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="covered">Covered (ABB mapped)</option>
        <option value="instantiated">Instantiated (SBB)</option>
        <option value="partial">Partially covered</option>
        <option value="gap">Gap</option>
        <option value="na">Not applicable</option>
      </select>
    </div>
    <div id="list"></div>
  </div>
  <div id="explore" class="page">
    <div class="xbar">
      <span style="font-weight:600">Perspective root:</span>
      <select id="xType"></select>
      <select id="xRoot" style="max-width:340px"></select>
      <span style="flex:1"></span>
      <span class="xprog" id="xProg"></span>
    </div>
    <div id="xtree"></div>
  </div>
  <div id="arch" class="page"></div>
  <div id="dash" class="page"></div>
  <div id="detail"></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<datalist id="abbNames"></datalist>
<datalist id="sbbNames"></datalist>
<script id="model-data" type="application/json">__MODEL_JSON__</script>
<script>
"use strict";
/* ================= reference model ================= */
const EMBEDDED_CATALOG=(function(){
  const j=JSON.parse(document.getElementById('model-data').textContent);
  return j.versions ? j : {versions:[{key:'default',label:j.modelName||'Reference model',data:j}],defaultKey:'default'};
})();
const LS_MODEL='ra-mapper-refmodel-v1', LS_CHOICE='ra-mapper-refchoice-v1';
let customModel=null, currentVersionKey=null;
let MODEL=null, byId={}, relsBySource={}, relsByTarget={};
function initModel(data){
  MODEL=data; byId={}; relsBySource={}; relsByTarget={};
  MODEL.elements.forEach(e=>byId[e.i]=e);
  MODEL.relationships.forEach(r=>{
    if(byId[r.s]&&byId[r.g]){
      (relsBySource[r.s]=relsBySource[r.s]||[]).push(r);
      (relsByTarget[r.g]=relsByTarget[r.g]||[]).push(r);
    }
  });
}
(function(){
  try{ const s=localStorage.getItem(LS_MODEL); if(s){ const m=JSON.parse(s); if(m&&m.elements&&m.elements.length) customModel=m; } }catch(e){}
  let choice=null; try{ choice=localStorage.getItem(LS_CHOICE); }catch(e){}
  if(choice==='__custom'&&customModel){ currentVersionKey='__custom'; initModel(customModel); }
  else{
    const v=EMBEDDED_CATALOG.versions.find(x=>x.key===choice)||EMBEDDED_CATALOG.versions.find(x=>x.key===EMBEDDED_CATALOG.defaultKey)||EMBEDDED_CATALOG.versions[0];
    currentVersionKey=v.key; initModel(v.data);
  }
})();
const STATUSES = {
  unreviewed:{label:'Unreviewed', c:'#8e9aa6', desc:'No mapping yet'},
  covered:{label:'Covered', c:'#0b5394', desc:'A local ABB specialises this'},
  instantiated:{label:'Instantiated', c:'#1a7f37', desc:'Realised by at least one SBB'},
  partial:{label:'Partial', c:'#b7791f', desc:'Partly covered (manual)'},
  gap:{label:'Gap', c:'#c0392b', desc:'Needed, not supported (manual)'},
  na:{label:'N/A', c:'#6b7280', desc:'Not applicable (manual)'}
};
const OVERRIDES=['partial','gap','na'];
/* reason → [label, default override status] */
const REASONS={
  'not-available':['Not available in our architecture','gap'],
  'planned':['Planned / on roadmap','gap'],
  'partial-support':['Partially supported','partial'],
  'not-interested':['Not interested','na'],
  'out-of-scope':['Out of scope in our context','na'],
  'handled-differently':['Handled differently','na'],
  'other':['Other (explain in notes)','na']
};
const ABB_TYPES = ['ApplicationComponent','ApplicationService','ApplicationFunction','BusinessProcess','BusinessFunction','BusinessService','Capability','DataObject','Node','TechnologyService'];
const FOLDER_ORDER = ['Strategy','Business','Application','Motivation','Implementation & Migration','Other'];
function topFolder(e){ return e.f.split('/')[0] || 'Other'; }
function typeLabel(t){ return t.replace(/([a-z])([A-Z])/g,'$1 $2'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= state (v2) ================= */
const LS_KEY='ra-mapper-state-v2', LS_KEY_V1='ra-mapper-state-v1';
let state = { version:2, meta:{organisation:'',country:'',author:'',notes:''}, abbs:{}, sbbs:{}, overrides:{} };
(function load(){
  try{
    const s=localStorage.getItem(LS_KEY);
    if(s){ state=Object.assign(state,JSON.parse(s)); return; }
    const v1=localStorage.getItem(LS_KEY_V1);
    if(v1){ state=migrateV1(JSON.parse(v1)); persist(); toast('Previous mappings migrated to the ABB/SBB model.'); }
  }catch(e){}
})();
function migrateV1(old){
  const st={version:2,meta:old.meta||{organisation:'',country:'',author:'',notes:''},abbs:{},sbbs:{},overrides:{}};
  const localRefs={};
  for(const refId in (old.assertions||{})){
    const a=old.assertions[refId];
    (a.localIds||[]).forEach(lid=>{ (localRefs[lid]=localRefs[lid]||[]).push(refId); });
    if(['partial','gap','na'].includes(a.status)||a.notes) st.overrides[refId]={status:['partial','gap','na'].includes(a.status)?a.status:null,notes:a.notes||''};
  }
  for(const lid in (old.locals||{})){
    const l=old.locals[lid];
    st.abbs[lid]={id:lid,name:l.name,type:l.type||'ApplicationComponent',desc:l.desc||'',refIds:localRefs[lid]||[]};
  }
  return st;
}

function sbbsForAbb(abbId){ return Object.values(state.sbbs).filter(s=>s.abbIds.includes(abbId)); }
function sbbsForRef(refId){
  const abbIds=abbsForRef(refId).map(a=>a.id);

  Object.values(state.sbbs).forEach(s=>{
    if(s.refIds.includes(refId)) out.push({sbb:s,via:null});

/* ================= oriented graph: "down" = towards more concrete =================
   Rank by abstraction level; an edge counts DOWNWARD when the other endpoint ranks lower.
   Same-rank ties are broken per relationship type. Flow is peer-to-peer: never down.   */
const RANK={Stakeholder:0,Driver:0,Assessment:0,Value:1,Goal:1,Meaning:1,Outcome:2,Capability:3,ValueStream:3,CourseOfAction:3,Resource:3,Product:4,BusinessFunction:4,BusinessProcess:4,BusinessService:4,BusinessActor:4,BusinessRole:4,BusinessEvent:4,Contract:4,Representation:4,Grouping:5,ApplicationComponent:6,ApplicationCollaboration:6,ApplicationService:7,ApplicationFunction:7,ApplicationInterface:7,ApplicationProcess:7,ApplicationEvent:7,SystemSoftware:7,Node:7,TechnologyService:7,DataObject:8,Artifact:8,WorkPackage:8,Deliverable:8};
function rank(t){ return RANK[t]!==undefined?RANK[t]:5; }
const DOWN_LABELS={
  'Composition-out':'composed of','Aggregation-out':'aggregates','Assignment-out':'assigned to',
  'Realization-in':'realised by','Realization-out':'realises (down)','Access-out':'accesses data',
  'Serving-in':'served by','Serving-out':'serves (down)','Specialization-in':'specialised by',
  'Triggering-out':'triggers','Influence-out':'influences','Association-out':'associated with','Association-in':'associated with',
  'Composition-in':'part of (down)','Aggregation-in':'aggregated (down)','Assignment-in':'assigned (down)','Access-in':'accessed by (down)','Influence-in':'influenced by (down)','Triggering-in':'triggered (down)','Specialization-out':'specialises (down)','Flow-out':'flow','Flow-in':'flow'
};
function isDownEdge(rt,meId,otherId,dir){
  if(!byId[otherId]) return false;
  if(rt==='Flow') return false;                      /* peer flows: never down */
  if(rt==='Access') return dir==='out';              /* data always below its accessor */
  const rm=rank(byId[meId].t), ro=rank(byId[otherId].t);
  if(ro>rm) return true;                             /* other is more concrete → down */
  if(ro<rm) return false;                            /* other is more abstract → up  */
  /* same rank: structural containment goes down source→target; realisation/serving pull the realiser/server below */
  if(rt==='Composition'||rt==='Aggregation'||rt==='Assignment'||rt==='Triggering'||rt==='Influence') return dir==='out';
  if(rt==='Realization'||rt==='Serving'||rt==='Specialization') return dir==='in';
  return false;                                      /* Association & others: ambiguous at same rank */
}
function edgeList(id){
  const out=[];
  (relsBySource[id]||[]).forEach(r=>out.push({t:r.t,o:r.g,dir:'out'}));
  (relsByTarget[id]||[]).forEach(r=>out.push({t:r.t,o:r.s,dir:'in'}));
  return out;
}
function downRels(id){
  return edgeList(id).filter(e2=>isDownEdge(e2.t,id,e2.o,e2.dir)).map(e2=>({o:e2.o,lbl:'↓ '+(DOWN_LABELS[e2.t+'-'+e2.dir]||e2.t)}));
}
function upRels(id){
  return edgeList(id).filter(e2=>!isDownEdge(e2.t,id,e2.o,e2.dir)).map(e2=>({o:e2.o,lbl:'↑ '+e2.t+(e2.dir==='in'?' (incoming)':' (outgoing)')}));
}
function downSet(id,cap){
  cap=cap||400;
  const seen=new Set([id]); const q=[id];
  while(q.length&&seen.size<cap){
    const cur=q.shift();
    downRels(cur).forEach(nb=>{ if(!seen.has(nb.o)&&seen.size<cap){ seen.add(nb.o); q.push(nb.o); } });
  }
  return seen;
}
let statsMemo=null;
function subtreeStats(id){
  if(statsMemo&&statsMemo.has(id)) return statsMemo.get(id);
  const s=downSet(id);
  let reviewed=0,conf=0,partial=0;
  s.forEach(i=>{
    const st=refStatus(i);
    if(st!=='unreviewed') reviewed++;
    if(st==='covered'||st==='instantiated') conf++;
    if(st==='partial') partial++;
  });
  const r={total:s.size,reviewed:reviewed,conf:conf,partial:partial};
  if(statsMemo) statsMemo.set(id,r);
  return r;
}
function xstatHTML(ss,wide){
  const revPct=ss.total?Math.round(100*ss.reviewed/ss.total):0;
  const confPct=ss.total?Math.round(100*(ss.conf+0.5*ss.partial)/ss.total):0;
  return '<span class="xstat" title="'+ss.reviewed+' of '+ss.total+' reviewed · '+ss.conf+' conforming ('+ss.partial+' partial) — counted downwards only">'+
    '<span class="xbarmini"'+(wide?' style="width:140px;height:10px"':'')+'><i class="r" style="width:'+revPct+'%"></i><i class="c" style="width:'+confPct+'%"></i></span>'+
    ss.reviewed+'/'+ss.total+' · '+confPct+'%✓</span>';
}

/* ================= perspectives (rooted downward graph) ================= */

  const tree=document.getElementById('xtree'); if(!tree) return;

function xNodeHTML(id,path,ancestors){
  const e=byId[id]; if(!e) return '';
  const st=refStatus(id);
  const abbs=abbsForRef(id), sbbs=sbbsForRef(id);
  let maps='';

    '</div>';

function xToggle(path){ if(xExpanded.has(path)) xExpanded.delete(path); else xExpanded.add(path); renderXTree(); }
function xQuick(id,val){
  if(!val) return;
  if(val==='__clear'||!val.includes(':')){ xNotMapped(id,val); return; }
  if(val.startsWith('r:')){ xNotMapped(id,val.slice(2)); return; }
  if(val.startsWith('abb:')){
    let aid=val.slice(4);
    if(aid==='__new'){
      const name=(window.prompt('Name of the new local ABB (will specialise "'+(byId[id]?byId[id].n:'')+'"):')||'').trim();
      if(!name) return;
      const ex=findByName(state.abbs,name);
      if(ex) aid=ex.id; else { aid=uid('abb'); state.abbs[aid]={id:aid,name:name,type:byId[id].t,desc:'',refIds:[]}; }
    }
    const a=state.abbs[aid]; if(!a) return;
    if(!a.refIds.includes(id)) a.refIds.push(id);
    persist(); renderXTree(); refreshDatalists(); return;
  }
  if(val.startsWith('sbb:')){
    let sid=val.slice(4);
    if(sid==='__new'){
      const name=(window.prompt('Name of the new SBB (will realise "'+(byId[id]?byId[id].n:'')+'" directly):')||'').trim();
      if(!name) return;
      const ex=findByName(state.sbbs,name);
      if(ex) sid=ex.id; else { sid=uid('sbb'); state.sbbs[sid]={id:sid,name:name,product:'',version:'',desc:'',abbIds:[],refIds:[]}; }
    }
    const s=state.sbbs[sid]; if(!s) return;
    if(!s.refIds.includes(id)) s.refIds.push(id);
    persist(); renderXTree(); refreshDatalists(); return;
  }
}
function xNotMapped(id,reason){
  if(!reason) return;
  if(reason==='__clear'){
    const ov=state.overrides[id];
    if(ov){ ov.status=null; delete ov.reason; if(!ov.notes) delete state.overrides[id]; }
    persist(); renderXTree(); return;
  }
  if(!REASONS[reason]) return;
  setOverride(id,REASONS[reason][1]);
  if(state.overrides[id]) state.overrides[id].reason=reason;
  persist(); renderXTree();
}

function parseArchiFile(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('not valid XML');
  const XSI='http://www.w3.org/2001/XMLSchema-instance';
  const getType=el=>((el.getAttribute('xsi:type')||el.getAttributeNS(XSI,'type')||'')+'').replace(/^archimate:/,'');
  const els=[],rels=[];
  if(doc.querySelector('folder')){ /* Archi native format */
    const walk=(node,path)=>{
      for(let i=0;i<node.children.length;i++){
        const ch=node.children[i];
        if(ch.tagName==='folder'){ const nm=ch.getAttribute('name')||''; walk(ch,path?path+'/'+nm:nm); continue; }
        if(ch.tagName!=='element') continue;
        const ty=getType(ch);
        if(!ty||ty==='ArchimateDiagramModel'||ty==='SketchModel') continue;
        if(ty.endsWith('Relationship')){ rels.push({t:ty.replace('Relationship',''),s:ch.getAttribute('source'),g:ch.getAttribute('target')}); continue; }
        const d=ch.querySelector(':scope > documentation');
        els.push({id:ch.getAttribute('id'),type:ty,name:(ch.getAttribute('name')||'').trim(),doc:d?d.textContent.trim():'',folder:path||''});
      }
    };
    const mroot=doc.documentElement;
    walk(mroot,'');
    return {name:(mroot&&mroot.getAttribute('name'))||'imported model',els:els.filter(e=>e.name),rels:rels};
  }
  /* Open Group exchange format */
  doc.querySelectorAll('elements > element').forEach(el=>{
    const ty=getType(el); if(!ty) return;
    const nm=el.querySelector('name'), d=el.querySelector('documentation');
    els.push({id:el.getAttribute('identifier'),type:ty,name:nm?nm.textContent.trim():'',doc:d?d.textContent.trim():''});
  });
  doc.querySelectorAll('relationships > relationship').forEach(r=>{
    rels.push({t:getType(r),s:r.getAttribute('source'),g:r.getAttribute('target')});
  });
  const nEl=doc.querySelector('model > name');
  return {name:nEl?nEl.textContent:'imported model',els:els.filter(e=>e.name),rels:rels};
}

  }).join('')+(vis.length>500?'<div class="hint">first 500 shown — use the filter</div>':'')+(vis.length?'':'<div class="hint" style="padding:14px">nothing matches</div>')+'</div>';

function impDo(kind){
  if(!impChecked.size){ toast('Select some elements first.'); return; }
  let n=0;
  impChecked.forEach(id0=>{
    const e=impData.els.find(x=>x.id===id0); if(!e) return;
    let id=id0;
    if(byId[id]) id='id-imp-'+id0; /* avoid clash with reference-model ids */
    if(state.abbs[id]||state.sbbs[id]) return;
    if(kind==='abb') state.abbs[id]={id:id,name:e.name,type:e.type,desc:e.doc||'',refIds:[]};
    else state.sbbs[id]={id:id,name:e.name,product:'',version:'',desc:e.doc||'',abbIds:[],refIds:[]};
    n++;
  });
  /* auto-link: Realization relationships from the imported model become SBB→ABB links */
  let linked=0;
  impData.rels.forEach(r=>{
    if(r.t!=='Realization') return;
    const s=state.sbbs[r.s]||state.sbbs['id-imp-'+r.s];
    const g=state.abbs[r.g]||state.abbs['id-imp-'+r.g];
    if(s&&g&&!s.abbIds.includes(g.id)){ s.abbIds.push(g.id); linked++; }
  });
  impChecked.clear(); persist(); renderImportModal(); renderArch(); refreshDatalists();
  toast(n+' imported as '+(kind==='abb'?'local ABBs':'SBBs')+(linked?' · '+linked+' SBB→ABB realisation(s) auto-linked':'')+'.');
}

/* ================= switch reference RA version ================= */
function layerOf(ty){
  if(/^(Capability|ValueStream|Resource|CourseOfAction)$/.test(ty)) return 'Strategy';
  if(/^(Goal|Driver|Outcome|Value|Stakeholder|Principle|Requirement|Constraint|Assessment|Meaning)$/.test(ty)) return 'Motivation';
  if(/^Business|^(Product|Contract|Representation)$/.test(ty)) return 'Business';
  if(/^Application|^DataObject$/.test(ty)) return 'Application';
  if(/^Technology|^(Node|SystemSoftware|Device|Artifact|CommunicationNetwork|Path)$/.test(ty)) return 'Technology';
  if(/^(WorkPackage|Deliverable|Plateau|Gap)$/.test(ty)) return 'Implementation & Migration';
  return 'Other';
}
function toModelData(parsed,src){
  const els=parsed.els.map(e=>({i:e.id,t:e.type,n:e.name,f:e.folder||layerOf(e.type),d:e.doc||''}));
  const ids=new Set(els.map(e=>e.i));
  const rels=parsed.rels.filter(r=>r.t&&ids.has(r.s)&&ids.has(r.g)).map((r,k)=>({i:'id-rel-'+k,t:r.t,s:r.s,g:r.g}));
  return {modelName:parsed.name,modelId:'id-loaded',source:src,custom:true,elements:els,relationships:rels};
}

  rd.onload=()=>{ try{

      if(!parsed.els.length) throw new Error('no ArchiMate elements found');
      const data=toModelData(parsed,f.name);
      customModel=data;
      try{ localStorage.setItem(LS_MODEL,JSON.stringify(data)); }catch(e){ toast('Note: model too large to persist — it will reset on reload.'); }
      applyVersion('__custom');
    }catch(err){ toast('Could not load model: '+err.message); }
    ev.target.value=''; };
  rd.readAsText(f);
});
function applyModel(data){
  initModel(data);
  let orphans=0;
  Object.values(state.abbs).forEach(a=>a.refIds.forEach(r=>{ if(!byId[r]) orphans++; }));
  Object.values(state.sbbs).forEach(s=>s.refIds.forEach(r=>{ if(!byId[r]) orphans++; }));
  Object.keys(state.overrides).forEach(r=>{ if(!byId[r]) orphans++; });

  const q=document.getElementById('q'); if(q) q.value='';
  const sf=document.getElementById('statusFilter'); if(sf) sf.value='';
  xRootId=null; xExpanded.clear(); xInited=false; selectedId=null;
  document.getElementById('detail').classList.remove('open');
  updateModelSub(); refresh();
  if(tab==='explore') renderExplore();
  if(tab==='arch') renderArch();
  if(tab==='dash') renderDash();
  toast('Reference model: '+MODEL.modelName+' — '+MODEL.elements.length+' elements'+(orphans?' · '+orphans+' existing mapping target(s) not present in this version (kept, will reappear if you switch back)':''));
}

document.getElementById('refVersion').addEventListener('change',ev=>applyVersion(ev.target.value));
function updateModelSub(){
  document.getElementById('modelSub').textContent=MODEL.modelName+' · '+MODEL.elements.length+' reference ABBs · '+MODEL.relationships.length+' relationships'+(MODEL.custom?' · loaded from '+(MODEL.source||'file'):'');
}

/* ================= dashboard ================= */
function renderDash(){
  statsMemo=new Map();
  const els=MODEL.elements;
  const counts={unreviewed:0,covered:0,instantiated:0,partial:0,gap:0,na:0};
  els.forEach(e=>counts[refStatus(e.i)]++);
  const assessed=els.length-counts.unreviewed;
  const applicable=els.length-counts.na;
  const conforming=counts.covered+counts.instantiated;
  const covPct=applicable? Math.round(100*(conforming+0.5*counts.partial)/applicable):0;
  let h='';
  h+='<div class="panel"><h2>Mapping context</h2><div class="metaGrid">'+
     mfield('Organisation / Ministry','organisation')+mfield('Country','country')+mfield('Author / contact','author')+mfield('General notes','notes')+
     '</div></div>';
  h+='<div class="cards">'+
    kpi(els.length,'Reference ABBs')+
    kpi(assessed+' <span style="font-size:13px;color:var(--muted)">('+Math.round(100*assessed/els.length)+'%)</span>','Assessed')+
    kpi('<span style="color:var(--st-covered)">'+counts.covered+'</span>','Covered (ABB only)')+
    kpi('<span style="color:var(--st-instantiated)">'+counts.instantiated+'</span>','Instantiated (SBB)')+
    kpi('<span style="color:var(--st-gap)">'+counts.gap+'</span>','Gaps')+
    kpi('<span style="color:'+(covPct>=70?'#1a7f37':covPct>=40?'#b7791f':'#c0392b')+'">'+covPct+'%</span>','Conformance (of applicable)')+
    '</div>';
  h+='<div class="legend">'+Object.entries(STATUSES).map(([k,s])=>'<span><i style="background:'+s.c+'"></i>'+s.label+'</span>').join('')+'</div>';
  /* capability perspectives — downward progress per capability */
  const caps=els.filter(e=>e.t==='Capability').map(e=>({e:e,ss:subtreeStats(e.i)})).sort((a,b)=>b.ss.total-a.ss.total).slice(0,30);
  h+='<div class="panel"><h2>Capability perspectives — downward progress &amp; conformance</h2><div class="hint" style="margin-bottom:10px">Each capability assessed over its downward subtree only (services it needs, components exposing them, data — never its parents).</div>';
  caps.forEach(c=>{
    const revPct=c.ss.total?Math.round(100*c.ss.reviewed/c.ss.total):0;
    const confPct=c.ss.total?Math.round(100*(c.ss.conf+0.5*c.ss.partial)/c.ss.total):0;
    h+='<div class="barRow click" onclick="jumpToPerspective(\''+c.e.i+'\')" style="cursor:pointer"><div class="lbl" title="'+esc(c.e.n)+'">'+esc(c.e.n)+'</div><div class="bar"><div class="seg" style="width:'+confPct+'%;background:var(--st-instantiated)"></div><div class="seg" style="width:'+Math.max(0,revPct-confPct)+'%;background:var(--st-partial)"></div></div><div class="pct">'+c.ss.reviewed+'/'+c.ss.total+' · '+confPct+'%✓</div></div>';
  });
  h+='</div>';
  const byType={};
  els.forEach(e=>{ (byType[e.t]=byType[e.t]||[]).push(e); });
  h+='<div class="panel"><h2>Coverage by element type</h2>';
  Object.keys(byType).sort((a,b)=>byType[b].length-byType[a].length).forEach(t=>{ h+=barRow(typeLabel(t),byType[t]); });
  h+='</div>';
  const byF={};
  els.forEach(e=>{ const f=topFolder(e); (byF[f]=byF[f]||[]).push(e); });
  h+='<div class="panel"><h2>Coverage by layer</h2>';
  FOLDER_ORDER.filter(f=>byF[f]).forEach(f=>{ h+=barRow(f,byF[f]); });
  h+='</div>';
  const attention=els.filter(e=>['gap','partial'].includes(refStatus(e.i)));
  h+='<div class="panel"><h2>Needs attention — gaps &amp; partial ('+attention.length+')</h2>';
  if(attention.length){
    h+='<table class="tbl"><tr><th>Reference ABB</th><th>Type</th><th>Status</th><th>Reason</th><th>Local ABBs</th><th>Notes</th></tr>';
    attention.forEach(e=>{
      const ovr=(state.overrides[e.i]||{}).reason;
      h+='<tr class="click" onclick="jumpTo(\''+e.i+'\')"><td><b>'+esc(e.n)+'</b></td><td>'+typeLabel(e.t)+'</td><td>'+chipHTML(refStatus(e.i))+'</td><td>'+(ovr&&REASONS[ovr]?REASONS[ovr][0]:'')+'</td><td>'+abbsForRef(e.i).map(a=>esc(a.name)).join(', ')+'</td><td style="max-width:300px">'+esc(refNotes(e.i))+'</td></tr>';
    });
    h+='</table>';
  } else h+='<div class="hint">Nothing flagged yet.</div>';
  h+='</div>';
  /* instantiation chain */
  const abbs=Object.values(state.abbs), sbbs=Object.values(state.sbbs);
  const orphanAbbs=abbs.filter(a=>!sbbsForAbb(a.id).length);
  const orphanSbbs=sbbs.filter(s=>!s.abbIds.length&&!s.refIds.length);
  h+='<div class="panel"><h2>Your architecture instantiation</h2>';
  h+='<div class="cards" style="margin-bottom:10px">'+kpi(abbs.length,'Local ABBs')+kpi(sbbs.length,'SBBs')+kpi(orphanAbbs.length,'ABBs without an SBB')+kpi(orphanSbbs.length,'Unlinked SBBs')+'</div>';
  if(orphanAbbs.length) h+='<div class="hint" style="margin-bottom:6px"><b>ABBs not yet realised by any SBB:</b> '+orphanAbbs.map(a=>esc(a.name)).join(', ')+'</div>';
  if(orphanSbbs.length) h+='<div class="hint"><b>SBBs not linked to anything:</b> '+orphanSbbs.map(s=>esc(s.name)).join(', ')+'</div>';
  if(!orphanAbbs.length&&!orphanSbbs.length&&(abbs.length||sbbs.length)) h+='<div class="hint">Every ABB is realised and every SBB is linked. ✔</div>';
  h+='</div>';
  document.getElementById('dash').innerHTML=h;
  ['organisation','country','author','notes'].forEach(k=>{
    const inp=document.getElementById('meta-'+k);
    if(inp) inp.addEventListener('input',ev=>{ state.meta[k]=ev.target.value; persist(); });
  });
}
function mfield(label,key){ return '<div><label>'+label+'</label><input id="meta-'+key+'" value="'+esc(state.meta[key]||'')+'"></div>'; }
function kpi(v,l){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function barRow(label,els){
  const c={unreviewed:0,covered:0,instantiated:0,partial:0,gap:0,na:0};
  els.forEach(e=>c[refStatus(e.i)]++);
  const n=els.length;
  let segs='';
  ['instantiated','covered','partial','gap','na','unreviewed'].forEach(k=>{
    if(c[k]) segs+='<div class="seg" style="width:'+(100*c[k]/n)+'%;background:'+STATUSES[k].c+'" title="'+STATUSES[k].label+': '+c[k]+'"></div>';
  });
  const done=n-c.unreviewed;
  return '<div class="barRow"><div class="lbl" title="'+esc(label)+'">'+esc(label)+'</div><div class="bar">'+segs+'</div><div class="pct">'+done+'/'+n+' assessed</div></div>';
}
function jumpTo(id){ showTab('browse'); filter={folder:null,type:null}; query=''; document.getElementById('q').value=''; statusFilter=''; document.getElementById('statusFilter').value=''; refresh(); openDetail(id); const row=document.querySelector('.row[data-id="'+id+'"]'); if(row) row.scrollIntoView({block:'center'}); }
function jumpToPerspective(id){
  showTab('explore'); xInit();
  const e=byId[id]; if(!e) return;
  const tSel=document.getElementById('xType');
  if([...tSel.options].some(o=>o.value===e.t)) tSel.value=e.t; xFillRoots();
  document.getElementById('xRoot').value=id;
  xRootId=id; xExpanded.clear(); xExpanded.add(id);
  renderXTree();
}

/* ================= tabs ================= */
function showTab(t){
  tab=t;
  document.getElementById('tabBrowse').classList.toggle('active',t==='browse');
  document.getElementById('tabExplore').classList.toggle('active',t==='explore');
  document.getElementById('tabArch').classList.toggle('active',t==='arch');
  document.getElementById('tabDash').classList.toggle('active',t==='dash');
  document.getElementById('sidebar').style.display=t==='browse'?'flex':'none';
  document.getElementById('listPane').style.display=t==='browse'?'flex':'none';
  document.getElementById('explore').classList.toggle('open',t==='explore');
  document.getElementById('arch').classList.toggle('open',t==='arch');
  document.getElementById('dash').classList.toggle('open',t==='dash');
  if(t!=='browse'&&t!=='explore') document.getElementById('detail').classList.remove('open');
  if(t==='explore') renderExplore();
  if(t==='arch') renderArch();
  if(t==='dash') renderDash();
}

/* ================= export (ArchiMate Model Exchange Format 3.1) ================= */
function xesc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function exportXML(){
  const NS='http://www.opengroup.org/xsd/archimate/3.0/';
  const abbs=Object.values(state.abbs), sbbs=Object.values(state.sbbs);
  const refIds=new Set();
  abbs.forEach(a=>a.refIds.forEach(r=>refIds.add(r)));
  sbbs.forEach(s=>s.refIds.forEach(r=>refIds.add(r)));
  Object.keys(state.overrides).forEach(r=>refIds.add(r));
  const usedWho=[...refIds].filter(id=>byId[id]);
  const today=new Date().toISOString().slice(0,10);
  const org=state.meta.organisation||state.meta.country||'Local architecture';
  let x='<?xml version="1.0" encoding="UTF-8"?>\n';
  x+='<model xmlns="'+NS+'" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="'+NS+' http://www.opengroup.org/xsd/archimate/3.1/archimate3_Diagram.xsd" identifier="id-mapping-'+today.replace(/-/g,'')+'">\n';
  x+='  <name xml:lang="en">'+xesc(org)+' — ABB/SBB mapping to '+xesc(MODEL.modelName)+'</name>\n';
  x+='  <documentation xml:lang="en">EIRA-style conformance mapping produced with SMART RA Mapper on '+today+'. Reference model: '+xesc(MODEL.modelName)+' ('+xesc(MODEL.source)+'). Local ABBs specialise reference ABBs (Specialization); SBBs realise ABBs or reference ABBs (Realization). Statuses, reasons and notes are element properties; full tool state is in model property "ra-mapper-state" for lossless re-import.</documentation>\n';
  x+='  <properties>\n    <property propertyDefinitionRef="pd-state"><value xml:lang="en">'+xesc(JSON.stringify(state))+'</value></property>\n  </properties>\n';
  x+='  <elements>\n';
  usedWho.forEach(id=>{
    const e=byId[id];
    const ov=state.overrides[id]||{};
    x+='    <element identifier="'+xesc(id)+'" xsi:type="'+e.t+'">\n      <name xml:lang="en">'+xesc(e.n)+'</name>\n      <properties>\n';
    x+='        <property propertyDefinitionRef="pd-origin"><value xml:lang="en">reference-abb</value></property>\n';
    x+='        <property propertyDefinitionRef="pd-status"><value xml:lang="en">'+refStatus(id)+'</value></property>\n';
    if(ov.status) x+='        <property propertyDefinitionRef="pd-override"><value xml:lang="en">'+ov.status+'</value></property>\n';
    if(ov.reason) x+='        <property propertyDefinitionRef="pd-reason"><value xml:lang="en">'+xesc(ov.reason)+'</value></property>\n';
    if(ov.notes) x+='        <property propertyDefinitionRef="pd-notes"><value xml:lang="en">'+xesc(ov.notes)+'</value></property>\n';
    x+='      </properties>\n    </element>\n';
  });
  abbs.forEach(a=>{
    x+='    <element identifier="'+xesc(a.id)+'" xsi:type="'+a.type+'">\n      <name xml:lang="en">'+xesc(a.name)+'</name>\n';
    if(a.desc) x+='      <documentation xml:lang="en">'+xesc(a.desc)+'</documentation>\n';
    x+='      <properties>\n        <property propertyDefinitionRef="pd-origin"><value xml:lang="en">local-abb</value></property>\n      </properties>\n    </element>\n';
  });
  sbbs.forEach(s=>{
    x+='    <element identifier="'+xesc(s.id)+'" xsi:type="ApplicationComponent">\n      <name xml:lang="en">'+xesc(s.name)+'</name>\n';
    if(s.desc) x+='      <documentation xml:lang="en">'+xesc(s.desc)+'</documentation>\n';
    x+='      <properties>\n        <property propertyDefinitionRef="pd-origin"><value xml:lang="en">sbb</value></property>\n';
    if(s.product) x+='        <property propertyDefinitionRef="pd-product"><value xml:lang="en">'+xesc(s.product)+'</value></property>\n';
    if(s.version) x+='        <property propertyDefinitionRef="pd-version"><value xml:lang="en">'+xesc(s.version)+'</value></property>\n';
    x+='      </properties>\n    </element>\n';
  });
  x+='  </elements>\n  <relationships>\n';
  let ri=0;
  abbs.forEach(a=>{
    a.refIds.forEach(rid=>{
      if(!byId[rid]) return;
      const relType=(a.type===byId[rid].t)?'Specialization':'Realization';
      x+='    <relationship identifier="id-map-'+(++ri)+'" source="'+xesc(a.id)+'" target="'+xesc(rid)+'" xsi:type="'+relType+'">\n      <name xml:lang="en">'+(relType==='Specialization'?'specialises':'realises')+' reference ABB</name>\n    </relationship>\n';
    });
  });
  sbbs.forEach(s=>{
    s.abbIds.forEach(aid=>{
      if(!state.abbs[aid]) return;
      x+='    <relationship identifier="id-map-'+(++ri)+'" source="'+xesc(s.id)+'" target="'+xesc(aid)+'" xsi:type="Realization">\n      <name xml:lang="en">realises ABB</name>\n    </relationship>\n';
    });
    s.refIds.forEach(rid=>{
      if(!byId[rid]) return;
      x+='    <relationship identifier="id-map-'+(++ri)+'" source="'+xesc(s.id)+'" target="'+xesc(rid)+'" xsi:type="Realization">\n      <name xml:lang="en">realises reference ABB (direct)</name>\n    </relationship>\n';
    });
  });
  x+='  </relationships>\n  <propertyDefinitions>\n';
  [['pd-state','ra-mapper-state'],['pd-origin','origin'],['pd-status','conformance-status'],['pd-override','manual-override'],['pd-reason','not-mapped-reason'],['pd-notes','assertion-notes'],['pd-product','product'],['pd-version','version']].forEach(([id,nm])=>{
    x+='    <propertyDefinition identifier="'+id+'" type="string"><name>'+nm+'</name></propertyDefinition>\n';
  });
  x+='  </propertyDefinitions>\n</model>\n';
  const blob=new Blob([x],{type:'application/xml'});
  const aEl=document.createElement('a');
  aEl.href=URL.createObjectURL(blob);
  aEl.download='ra-mapping-'+(org.replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()||'local')+'-'+today+'.xml';
  aEl.click(); URL.revokeObjectURL(aEl.href);
  toast('Exported: '+usedWho.length+' reference ABBs, '+abbs.length+' local ABBs, '+sbbs.length+' SBBs.');
}

/* ================= import ================= */
document.getElementById('importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ importXML(rd.result); }catch(err){ toast('Import failed: '+err.message); } ev.target.value=''; };
  rd.readAsText(f);
});
function importXML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('not valid XML');
  const defs={};
  doc.querySelectorAll('propertyDefinition').forEach(pd=>{ defs[pd.getAttribute('identifier')]=(pd.querySelector('name')||{}).textContent; });
  let restored=null;
  doc.querySelectorAll('model > properties > property').forEach(p=>{
    if(defs[p.getAttribute('propertyDefinitionRef')]==='ra-mapper-state'){
      const v=p.querySelector('value'); if(v) restored=JSON.parse(v.textContent);
    }
  });
  if(restored){
    state = restored.version===2 ? restored : migrateV1(restored);
  } else {
    const st={version:2,meta:{organisation:'',country:'',author:'',notes:''},abbs:{},sbbs:{},overrides:{}};
    const props=el=>{ const o={}; el.querySelectorAll(':scope > properties > property').forEach(p=>{ const n=defs[p.getAttribute('propertyDefinitionRef')]; const v=p.querySelector('value'); if(n&&v) o[n]=v.textContent; }); return o; };
    doc.querySelectorAll('elements > element').forEach(el=>{
      const id=el.getAttribute('identifier'); const pr=props(el);
      const nm=(el.querySelector('name')||{}).textContent||'';
      const ty=el.getAttribute('xsi:type')||el.getAttributeNS('http://www.w3.org/2001/XMLSchema-instance','type')||'ApplicationComponent';
      if(pr.origin==='local-abb') st.abbs[id]={id:id,name:nm,type:ty,desc:'',refIds:[]};
      else if(pr.origin==='sbb') st.sbbs[id]={id:id,name:nm,product:pr.product||'',version:pr.version||'',desc:'',abbIds:[],refIds:[]};
      else if(pr.origin==='local'&&!byId[id]) st.abbs[id]={id:id,name:nm,type:ty,desc:'',refIds:[]};
      if(byId[id]&&(pr['manual-override']||pr['assertion-notes']||pr['not-mapped-reason'])){
        st.overrides[id]={status:pr['manual-override']||null,notes:pr['assertion-notes']||''};
        if(pr['not-mapped-reason']) st.overrides[id].reason=pr['not-mapped-reason'];
      }
    });
    doc.querySelectorAll('relationships > relationship').forEach(r=>{
      const s=r.getAttribute('source'), g=r.getAttribute('target');
      if(st.abbs[s]&&byId[g]){ if(!st.abbs[s].refIds.includes(g)) st.abbs[s].refIds.push(g); }
      else if(st.sbbs[s]&&st.abbs[g]){ if(!st.sbbs[s].abbIds.includes(g)) st.sbbs[s].abbIds.push(g); }
      else if(st.sbbs[s]&&byId[g]){ if(!st.sbbs[s].refIds.includes(g)) st.sbbs[s].refIds.push(g); }
    });
    state=st;
  }
  persist(); refresh(); refreshDatalists();
  if(tab==='explore') renderXTree();
  if(tab==='arch') renderArch();
  if(tab==='dash') renderDash();
  toast('Imported: '+Object.keys(state.abbs).length+' ABBs, '+Object.keys(state.sbbs).length+' SBBs, '+Object.keys(state.overrides).length+' overrides/notes.');
}

/* ================= misc ================= */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
document.getElementById('q').addEventListener('input',ev=>{ query=ev.target.value; renderList(); });
document.getElementById('statusFilter').addEventListener('change',ev=>{ statusFilter=ev.target.value; renderList(); });
function refresh(){ statsMemo=new Map(); buildTree(); renderList(); }
updateModelSub(); renderVersionSelect();
refresh(); refreshDatalists();
