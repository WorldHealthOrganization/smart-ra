<g class="av-legend"><rect x="268" y="854" width="829" height="364" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="278" y="872">Key</text><text class="av-keyh" x="278" y="888">Colour: which part of the architecture a box belongs to</text><rect x="278" y="897" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="336" y="908">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="278" y="917" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="336" y="928">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="278" y="937" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="336" y="948">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="278" y="968">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="278" y="976" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="992">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="278" y="1006" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1022">Rounded ends: a service, offered for others to use</text><rect x="278" y="1036" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1052">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="278" y="1078">Other marks</text><rect x="278" y="1085" width="44" height="18" fill="#fff" stroke="#555"/><rect x="288" y="1090" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="336" y="1098">A box inside another box: a part of it</text><rect x="278" y="1107" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="278" y="1107" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="336" y="1118">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="278" y="1138">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M288 1154 L320 1154" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="336" y="1158">Realization: makes real, or achieves</text><path d="M288 1174 L320 1174" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="336" y="1178">Serving: serves (provides what the end needs)</text><path d="M288 1194 L320 1194" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="336" y="1198">Access: reads or writes data (the arrow shows which way the data goes)</text></g></svg>
